<nav class="roster-tools" aria-label="Roster tools">
  <a {% if active_tool == 'rosters' %}class="active" aria-current="page"{% endif %} href="/rosters?league={{ league.id }}">
    <strong>League rosters</strong><small>View every team</small>
  </a>
  <a {% if active_tool in ['moves','watchlist','compare'] %}class="active" aria-current="page"{% endif %} href="/moves?league={{ league.id }}">
    <strong>Market &amp; research</strong><small>Waivers, watchlist &amp; compare</small>
  </a>
  <a {% if active_tool == 'trades' %}class="active" aria-current="page"{% endif %} href="/trades?league={{ league.id }}">
    <strong>Trades</strong><small>Offers &amp; trade block</small>
  </a>
  <a {% if active_tool == 'leaders' %}class="active" aria-current="page"{% endif %} href="/leaders?league={{ league.id }}">
    <strong>League leaders</strong><small>Ranks &amp; ownership</small>
  </a>
</nav>
