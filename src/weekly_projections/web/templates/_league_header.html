<a class="skip-to-content" href="#main-content">Skip to content</a>
<header class="topbar league-topbar">
  <a href="/home?league={{ league.id }}" class="brand-mark small" aria-label="League home">WP</a>
  <form class="header-league-picker" method="get" action="/{{ active_tool|default('home') }}">
    {% if active_tool in ['scores', 'lineup'] and week %}<input type="hidden" name="week" value="{{ week }}">{% endif %}
    <label for="header-league"><span class="sr-only">Switch league</span><select id="header-league" name="league" aria-label="Switch league">{% for item in session.leagues %}<option value="{{ item.id }}" {% if item.id == league.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label>
    <button type="submit" class="league-switch-button">Switch</button>
  </form>
  <details class="site-options"><summary aria-label="Appearance and account options"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg><span>Settings</span></summary><div class="site-options-panel"><div data-theme-slot></div><p class="fine-print">MFL access uses an encrypted session. Passwords and API keys are never stored.</p><form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><button class="secondary-button">Disconnect MFL</button></form></div></details>
  {% include '_navigation.html' %}
</header>
