<a class="skip-to-content" href="#main-content">Skip to content</a>
<header class="topbar league-topbar">
  <a href="/home?league={{ league.id }}" class="brand-mark small" aria-label="League home">WP</a>
  <form class="header-league-picker" method="get" action="/{{ active_tool|default('home') }}">
    {% if active_tool in ['scores', 'lineup'] and week %}<input type="hidden" name="week" value="{{ week }}">{% endif %}
    <label for="header-league"><span class="sr-only">Switch league</span><select id="header-league" name="league" aria-label="Switch league">{% for item in session.leagues %}<option value="{{ item.id }}" {% if item.id == league.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label>
    <button type="submit" class="league-switch-button">Switch</button>
  </form>
  <details class="site-options"><summary aria-label="Appearance and account options"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg><span>Settings</span></summary><div class="site-options-panel"><div data-theme-slot></div><details class="api-key-settings"><summary>MFL API key{% if session.mfl_api_key %}<span>Active</span>{% endif %}</summary><form method="post" action="/session/api-key" autocomplete="off"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><input type="hidden" name="league" value="{{ league.id }}"><label>API key<input name="api_key" type="password" maxlength="512" autocomplete="off" autocapitalize="none" spellcheck="false" required></label><button type="submit">{{ 'Replace key' if session.mfl_api_key else 'Add key' }}</button><small>Kept only until you disconnect, the app restarts, or the eight-hour session expires.</small></form></details><form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><button class="secondary-button">Disconnect MFL</button></form></div></details>
  {% include '_navigation.html' %}
</header>
