[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-projections-ml"
version = "0.3.0"
description = "A private MyFantasyLeague lineup, scoring, waiver, and trade assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3.0",
  "scipy>=1.13,<2.0",
  "requests>=2.32,<3.0",
  "python-dotenv>=1.0,<2.0",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.34,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10.0", "httpx>=0.28,<1.0"]

[project.scripts]
weekly-projections-web = "weekly_projections.web.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weekly_projections = ["web/templates/*.html", "web/static/*.css", "web/static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
